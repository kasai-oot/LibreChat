name: Weekly Upstream Sync

on:
  schedule:
    # 毎週月曜日 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no PR creation)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod-railway
        uses: actions/checkout@v4
        with:
          ref: prod-railway
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "kasai-oot[bot]"
          git config user.email "kasai-oot@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/danny-avila/LibreChat.git
          git fetch upstream main --depth=100

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream is $BEHIND commits ahead"
          if [ "$BEHIND" = "0" ]; then
            echo "No upstream changes. Exiting."
          fi

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          DATE=$(date '+%Y-%m-%d')
          BRANCH="upstream-sync/${DATE}"
          echo "BRANCH=${BRANCH}" >> $GITHUB_ENV
          git checkout -b "${BRANCH}"

      - name: Attempt merge
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          git merge upstream/main --no-commit --no-ff || true
          CONFLICTS=$(git diff --name-only --diff-filter=U | wc -l)
          echo "conflicts=$CONFLICTS" >> $GITHUB_OUTPUT
          echo "Conflicts: $CONFLICTS files"
          if [ "$CONFLICTS" -gt "0" ]; then
            echo "=== Conflicting files ==="
            git diff --name-only --diff-filter=U
          fi

      - name: Resolve known safe conflicts (take upstream)
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflicts != '0'
        run: |
          # カスタムファイルは prod-railway のバージョンを保持
          KEEP_OURS="librechat.yaml config/x3d-policy.md config/x3d-tos.md GEMINI.md WARP.md"
          for f in $KEEP_OURS; do
            if git diff --name-only --diff-filter=U | grep -q "^${f}$"; then
              git checkout --ours "$f"
              git add "$f"
              echo "Kept ours: $f"
            fi
          done

          # アイコン・ロゴは prod-railway のバージョンを保持
          ICON_FILES=$(git diff --name-only --diff-filter=U | grep "client/public/assets/" || true)
          if [ -n "$ICON_FILES" ]; then
            git checkout --ours $ICON_FILES
            git add $ICON_FILES
            echo "Kept ours: $ICON_FILES"
          fi

      - name: Check remaining conflicts
        if: steps.check.outputs.behind != '0'
        id: remaining
        run: |
          REMAINING=$(git diff --name-only --diff-filter=U | wc -l)
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          if [ "$REMAINING" -gt "0" ]; then
            echo "=== Remaining conflicts (manual resolution needed) ==="
            git diff --name-only --diff-filter=U
            git merge --abort
          fi

      - name: Complete merge
        if: steps.check.outputs.behind != '0' && steps.remaining.outputs.remaining == '0'
        run: |
          git commit -m "chore: sync upstream $(date '+%Y-%m-%d')

Auto-merged upstream changes from danny-avila/LibreChat main.
Kept kasai-oot customizations (librechat.yaml, icons, legal docs)."

      - name: Push branch and create PR (no conflicts)
        if: |
          steps.check.outputs.behind != '0' &&
          steps.remaining.outputs.remaining == '0' &&
          github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git push origin "${BRANCH}"
          gh pr create \
            --title "chore: upstream sync $(date '+%Y-%m-%d')" \
            --body "## 自動アップストリーム同期

upstream/main から \`${{ steps.check.outputs.behind }}\` コミットを取り込みました。

### カスタマイズ保持状況
- ✅ librechat.yaml (X3D・Bedrock設定)
- ✅ アイコン・ロゴ (ブランドアセット)
- ✅ 法的文書 (x3d-policy.md, x3d-tos.md)

### 確認事項
- [ ] librechat.yaml に破壊的変更がないか確認
- [ ] Railwayデプロイが成功するか確認

🤖 Generated by Weekly Upstream Sync workflow" \
            --base prod-railway \
            --head "${BRANCH}"

      - name: Notify Discord - Success
        if: steps.check.outputs.behind != '0' && steps.remaining.outputs.remaining == '0'
        run: |
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ **LibreChat アップストリーム同期PR作成** \\`upstream-sync/$(date '+%Y-%m-%d')\\`\\nPRをレビューしてマージしてください。\"}" \
            "https://discord.com/api/v10/channels/1485265305403129976/messages"

      - name: Notify Discord - Conflicts
        if: steps.check.outputs.behind != '0' && steps.remaining.outputs.remaining != '0'
        run: |
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "不明")
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **LibreChat アップストリーム同期で手動対応が必要です**\\nコンフリクトファイル: \`${CONFLICT_FILES}\`\\n手動でマージして upstream-sync ブランチを作成してください。\"}" \
            "https://discord.com/api/v10/channels/1485265305403129976/messages"

      - name: Notify Discord - No changes
        if: steps.check.outputs.behind == '0'
        run: |
          echo "No upstream changes - skipping Discord notification"
